name: Eureka LMS CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Build, Migrate & Regression Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: eureka_lms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ⚙️ Generate Prisma Client
        run: npx prisma generate

      - name: 🗄️ Apply Database Migrations
        env:
          DATABASE_URL: 'mysql://root:@127.0.0.1:3306/eureka_lms'
        run: npx prisma migrate deploy

      - name: 🌱 Seed Database
        env:
          DATABASE_URL: 'mysql://root:@127.0.0.1:3306/eureka_lms'
          DEFAULT_ADMIN_EMAIL: 'admin@eureka.com'
          DEFAULT_ADMIN_PASSWORD: 'Admin@SecurePass2026!'
          DEFAULT_ADMIN_PHONE: '01000000000'
        run: node prisma/seed.js

      - name: 🧪 Execute Complete Test Suite (262 Tests)
        env:
          NODE_ENV: test
          PORT: 5000
          DATABASE_URL: 'mysql://root:@127.0.0.1:3306/eureka_lms'
          JWT_SECRET: 'b50868b892cf59adb357a1d6494af8030e61aa73e3fa6a75511f558f176c8a86992116b6317872f4503fa22e2c203de8f330427696090d2f80cfb69a4af15554'
          JWT_REFRESH_SECRET: '3832cc3cd56a89e13005aa4488555a1f3228c7f50543a340df0709d1e614ffc8566ec62b69a00353accdf1ddfe85b3c91f99bb29f14b10654e5e95d8d727383d'
          JWT_EXPIRES_IN: '7d'
          JWT_REFRESH_EXPIRES_IN: '30d'
          DEFAULT_ADMIN_EMAIL: 'admin@eureka.com'
          DEFAULT_ADMIN_PASSWORD: 'Admin@SecurePass2026!'
          DEFAULT_ADMIN_PHONE: '01000000000'
        run: npm test
